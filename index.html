<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGT Photo-Oracle Value & Longevity Calculator</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-color: #111111;
            --gold: #FFD700;
            --gold-dim: #B8860B;
            --cyan: #00FFFF;
            --text-color: #E0E0E0;
            --accent-red: #FF3333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1, h2, h3 {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-color);
            border: 1px solid var(--gold-dim);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .app-link {
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: var(--cyan);
        }
        .app-link a { color: var(--cyan); text-decoration: none; border-bottom: 1px dashed var(--cyan); }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--gold);
            font-size: 0.9em;
            font-weight: bold;
        }

        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 10px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: var(--text-color);
            border-radius: 5px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--cyan);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 400px;
            background-color: #000;
            border: 2px dashed var(--gold-dim);
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 15px;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .upload-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, var(--gold-dim), var(--gold));
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }

        .upload-btn:hover {
            transform: scale(1.02);
        }

        .calculate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #004444, var(--cyan));
            color: #000;
            font-weight: bold;
            font-size: 1.1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .calculate-btn:hover {
            box-shadow: 0 0 15px var(--cyan);
        }

        .results-panel {
            margin-top: 25px;
            padding: 20px;
            background-color: #0a0a0a;
            border: 1px solid var(--cyan);
            border-radius: 5px;
            display: none; /* Hidden by default */
        }

        .result-line {
            font-family: 'Courier New', Courier, monospace;
            margin: 10px 0;
            font-size: 1.1em;
            line-height: 1.5;
        }

        .highlight { color: var(--gold); font-weight: bold; }
        .highlight-cyan { color: var(--cyan); font-weight: bold; }
        .highlight-red { color: var(--accent-red); font-weight: bold; }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            font-size: 0.8em;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AGT Photo-Oracle Value Calculator</h1>
        <div class="app-link">
            Integrated with Photo Oracle App: <a href="https://use-any-photo-type-check-your-dsy-o.vercel.app/" target="_blank">use-any-photo-type-check-your-dsy-o.vercel.app</a>
        </div>

        <div class="grid-layout">
            <!-- Left Column: Inputs -->
            <div>
                <div class="input-group">
                    <label>Full Name (first-name surname)</label>
                    <input type="text" id="fullName" placeholder="e.g., charlize theron" value="david gomadza">
                </div>
                <div class="input-group">
                    <label>Day of Birth</label>
                    <input type="date" id="dob">
                </div>
                <div class="input-group">
                    <label>Day of Death at Birth (Original)</label>
                    <input type="date" id="dodBirth">
                </div>
                
                <h3>Five-Finger Wealth Algorithm</h3>
                <div class="input-group">
                    <label>👍 Thumb: Bank Balance (Multiplier x20)</label>
                    <input type="number" id="bankBalance" value="100000000000">
                </div>
                <div class="input-group">
                    <label>☝️ Index: Gold Vouchers (Multiplier x38)</label>
                    <input type="number" id="goldVouchers" value="500000000000000">
                </div>
                <div class="input-group">
                    <label>🖕 Middle: Cash in Bank (Multiplier x42)</label>
                    <input type="number" id="cashInBank" value="50000000000">
                </div>
                <div class="input-group">
                    <label>💍 Ring: Borrowings All (Multiplier x30)</label>
                    <input type="number" id="borrowings" value="0">
                </div>
                <div class="input-group">
                    <label>🤙 Little: Bad Debt (Multiplier x0)</label>
                    <input type="number" id="badDebt" value="0">
                </div>

                <button class="calculate-btn" onclick="processOracle()">Scan Face & Calculate Advalue</button>
            </div>

            <!-- Right Column: Visualizer -->
            <div>
                <label>Upload Photo for Facial Mapping</label>
                <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                <button class="upload-btn" onclick="document.getElementById('imageUpload').click()">Choose Photo</button>
                
                <div class="canvas-container">
                    <canvas id="oracleCanvas"></canvas>
                </div>

                <div class="legend">
                    <div class="legend-item"><div class="dot" style="background: #FFD700;"></div> Forehead (Bank)</div>
                    <div class="legend-item"><div class="dot" style="background: #00FFFF;"></div> Eyelids (Gold)</div>
                    <div class="legend-item"><div class="dot" style="background: #FF3333;"></div> Nose Tip (Cash)</div>
                    <div class="legend-item"><div class="dot" style="background: #33FF33;"></div> Left Ear (Borrow)</div>
                    <div class="legend-item"><div class="dot" style="background: #FF00FF;"></div> Bottom Lip (Bad Debt)</div>
                </div>
            </div>
        </div>

        <!-- Results Panel -->
        <div class="results-panel" id="resultsPanel">
            <h2>Oracle Decryption Complete</h2>
            <div id="outputText"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('oracleCanvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        let isImageLoaded = false;

        // Set default dates for demonstration
        document.getElementById('dob').value = "1976-06-28";
        document.getElementById('dodBirth').value = "2026-07-02";

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    img.onload = function() {
                        // Resize canvas to fit container while maintaining aspect ratio
                        const container = canvas.parentElement;
                        const scale = Math.min(container.clientWidth / img.width, container.clientHeight / img.height);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        isImageLoaded = true;
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function drawMappingLines() {
            if (!isImageLoaded) {
                // Draw a placeholder face if no image is uploaded
                canvas.width = 400;
                canvas.height = 400;
                ctx.fillStyle = "#222";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#555";
                ctx.beginPath();
                ctx.arc(200, 180, 100, 0, Math.PI * 2); // Head
                ctx.fill();
                isImageLoaded = true;
            }

            const w = canvas.width;
            const h = canvas.height;
            const startX = 0;
            const startY = h; // Bottom left corner

            const points = [
                { x: w * 0.5, y: h * 0.15, color: '#FFD700', label: 'Thumb: Bank Balance' }, // Forehead
                { x: w * 0.5, y: h * 0.35, color: '#00FFFF', label: 'Index: Gold Vouchers' }, // Eyelids
                { x: w * 0.5, y: h * 0.55, color: '#FF3333', label: 'Middle: Cash' },          // Nose tip
                { x: w * 0.2, y: h * 0.40, color: '#33FF33', label: 'Ring: Borrowings' },      // Left ear
                { x: w * 0.5, y: h * 0.75, color: '#FF00FF', label: 'Little: Bad Debt' }       // Bottom lip
            ];

            let delay = 0;
            points.forEach((point, index) => {
                setTimeout(() => {
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(point.x, point.y);
                    ctx.strokeStyle = point.color;
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Draw point
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = point.color;
                    ctx.fill();

                    // Draw label
                    ctx.fillStyle = "#FFF";
                    ctx.font = "bold 12px Arial";
                    ctx.fillText(point.label, point.x + 10, point.y);
                }, delay);
                delay += 600; // 600ms delay between each line
            });
        }

        function formatCurrency(num) {
            return "US$" + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function generateAjaerAjaerDay(originalDod) {
            const date = new Date(originalDod);
            const month = date.toLocaleString('default', { month: 'long' }).toLowerCase();
            const day = date.getDate();
            // The AGT8000 changes the year to 7777777 or 9999999999...
            const yearString = "999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999999......";
            return `${day} ${month} ${yearString}meaning will never die (the end of everything) but never achieved by anyone you are the first one`;
        }

        function processOracle() {
            // 1. Draw the facial mapping
            drawMappingLines();

            // 2. Get values
            const name = document.getElementById('fullName').value.toLowerCase().trim();
            const bank = parseFloat(document.getElementById('bankBalance').value) || 0;
            const gold = parseFloat(document.getElementById('goldVouchers').value) || 0;
            const cash = parseFloat(document.getElementById('cashInBank').value) || 0;
            const borrow = parseFloat(document.getElementById('borrowings').value) || 0;
            const badDebt = parseFloat(document.getElementById('badDebt').value) || 0;
            const dodBirth = document.getElementById('dodBirth').value;

            // 3. Calculate Advalue
            // Formula: (bank * 20) + (gold * 38) + (cash * 42) + (borrow * 30) - (badDebt * 0) + 8.4 Trillion (AGT Base Value)
            const agtBaseValue = 8400000000000; 
            const advalue = (bank * 20) + (gold * 38) + (cash * 42) + (borrow * 30) - (badDebt * 0) + agtBaseValue;

            // 4. Format Output
            const ajaerDay = generateAjaerAjaerDay(dodBirth);
            
            const outputHTML = `
                <div class="result-line">advalue this,'<span class="highlight">${name}</span>'</div>
                <div class="result-line"><span class="highlight-cyan">${formatCurrency(advalue)}</span></div>
                <div class="result-line">ajaer agaer day: <span class="highlight-red">${ajaerDay}</span></div>
                <br>
                <div class="result-line" style="font-size: 0.9em; color: #888;">
                    <em>* Facial mapping complete. Digital enzymes decoded from bottom-left origin point.<br>
                    * AGT8000 protocol applied: Death removed x8. Value increased by US$8.4 Trillion baseline.</em>
                </div>
            `;

            const resultsPanel = document.getElementById('resultsPanel');
            const outputText = document.getElementById('outputText');
            
            resultsPanel.style.display = 'block';
            outputText.innerHTML = outputHTML;
            
            // Smooth scroll to results
            resultsPanel.scrollIntoView({ behavior: 'smooth' });
        }

        // Initialize with a blank canvas prompt
        window.onload = function() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#555";
            ctx.font = "16px Arial";
            ctx.textAlign = "center";
            ctx.fillText("Upload a photo to begin facial mapping", canvas.width/2, canvas.height/2);
        }
    </script>
</body>
</html>
